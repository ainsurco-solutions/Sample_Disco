[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "migration-hub"
version = "0.1.0"
description = "Bulk migration engine for RiskLink EDM backups into the Moody's Intelligent Risk Platform"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "python-dotenv>=1.0",       # loads .env into the process environment
    "httpx>=0.27",              # platform REST calls
    "boto3>=1.34",              # S3 SigV4 transfer -- see ADR-0002
    "sqlalchemy>=2.0",
    "pyodbc>=5.1",              # MS SQL Server driver
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.36",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",              # httpx mocking
    "moto[s3,server]>=5.0",     # S3 mocking -- [server] for dev-tools/mock_irp's ThreadedMotoServer
    "ruff>=0.5",
    "mypy>=1.10",
    "types-boto3",
]

[project.scripts]
migration-hub = "migration_hub.cli:main"
migration-hub-api = "migration_hub.api.main:serve"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_hub"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S"]
ignore = [
    "S101",  # assert -- fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # hardcoded test credentials
"src/migration_hub/cli.py" = ["B008"]  # typer.Option(...) as a default is the idiom
"dev-tools/**" = ["B008"]  # FastAPI Header()/Query() as a default is the idiom
"src/migration_hub/api/**" = ["B008"]  # FastAPI Depends(...) as a default is the idiom

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Stubs raise NotImplementedError; that is intentional during scaffolding.
warn_no_return = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "integration: requires a registry database",
    "vendor: calls the real Moody's API -- never run unattended",
]
