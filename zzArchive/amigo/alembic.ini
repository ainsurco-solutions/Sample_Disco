[alembic]
script_location = migrations
prepend_sys_path = .

# Real value is supplied at runtime by migrations/env.py, from
# MIGRATION_HUB_DATABASE_URL. This placeholder only satisfies alembic's own
# validation when the env var is not set (e.g. `alembic history`).
sqlalchemy.url = mssql+pyodbc://localhost/AML_MigHub_Dev?driver=ODBC+Driver+18+for+SQL+Server&trusted_connection=yes

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
