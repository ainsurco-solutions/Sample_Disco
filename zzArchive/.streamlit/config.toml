# Shared application theme. Keep in sync with the other app's config.toml.
# tests/unit/test_ui_visual_parity.py enforces deployment parity.
[theme]
font = "sans-serif"
codeFont = "monospace"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["2.75rem", "1.75rem", "1.25rem", "1.1rem", "1rem", "1rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#1B1464"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8F8F8"
textColor = "#1a1a1a"
borderColor = "#D8D9DB"
linkColor = "#1B1464"
codeBackgroundColor = "#F8F8F8"
codeTextColor = "#1a1a1a"
greenColor = "#1E7B34"
greenBackgroundColor = "#E4F3EA"
greenTextColor = "#1F5B41"
redColor = "#B3261E"
redBackgroundColor = "#FBE9E9"
redTextColor = "#8A2C2C"
orangeColor = "#B26A00"
orangeBackgroundColor = "#FBF0DF"
orangeTextColor = "#7A4E0A"
blueColor = "#1B1464"
blueBackgroundColor = "#E8E7F2"
blueTextColor = "#141052"
grayColor = "#5B6B78"
grayBackgroundColor = "#F8F8F8"
grayTextColor = "#3F4C57"
dataframeBorderColor = "#D8D9DB"
dataframeHeaderBackgroundColor = "#F8F8F8"

[theme.dark]
primaryColor = "#77B7D8"
backgroundColor = "#242424"
secondaryBackgroundColor = "#2B2B2D"
textColor = "#D4D4D4"
borderColor = "#454545"
linkColor = "#77B7D8"
codeBackgroundColor = "#2B2B2D"
codeTextColor = "#D4D4D4"
greenColor = "#7ABF9B"
greenBackgroundColor = "#21352B"
greenTextColor = "#9CD7B5"
redColor = "#E38B87"
redBackgroundColor = "#3D292A"
redTextColor = "#F0AAA6"
orangeColor = "#D8AC67"
orangeBackgroundColor = "#3D3224"
orangeTextColor = "#E8C58B"
blueColor = "#77B7D8"
blueBackgroundColor = "#263641"
blueTextColor = "#A0D0E8"
grayColor = "#A4A4A8"
grayBackgroundColor = "#303033"
grayTextColor = "#C2C2C5"
dataframeBorderColor = "#454545"
dataframeHeaderBackgroundColor = "#2B2B2D"
